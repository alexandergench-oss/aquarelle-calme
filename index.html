  <body>
<style>
  /* Une seule ambiance, celle du papier : la page ne change pas avec le thème. */
  :root {
    --papier: #f7f2e8;
    --papier-fonce: #eee7d9;
    --texte: #6e665e;
    --texte-doux: #a39b92;
  }
  html,
  body {
    height: 100%;
  }
  body {
    overflow: hidden;
    background: var(--papier-fonce);
    color: var(--texte);
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }
  #root {
    display: flex;
    height: 100%;
    flex: 1;
  }
  .attente {
    margin: auto;
    padding-inline: 24px;
    text-align: center;
  }
  .attente h1 {
    margin: 0 0 8px;
    font-size: 30px;
    font-weight: 300;
    letter-spacing: 1.5px;
  }
  .attente p {
    margin: 0;
    font-size: 15px;
    color: var(--texte-doux);
  }
</style>
<div id="root">
  <div class="attente">
    <h1>Aquarelle calme</h1>
    <p id="etat">Le jeu se prépare…</p>
  </div>
</div>
<script>
  // Si le jeu ne peut pas démarrer, on le dit simplement au lieu de laisser une page vide.
  window.addEventListener('error', function () {
    var etat = document.getElementById('etat');
    if (etat) etat.textContent = 'Le jeu n’a pas pu démarrer dans ce navigateur.';
  });
  window.addEventListener('unhandledrejection', function () {
    var etat = document.getElementById('etat');
    if (etat) etat.textContent = 'Le jeu n’a pas pu démarrer dans ce navigateur.';
  });
</script>
<script src="jeu.js" defer></script>

    <script>
      // --- Jeu hors ligne : on enregistre tout sur le téléphone.
      // L'avancement est lu par le jeu (Paramètres) dans window.aquarelleHorsLigne.
      (function () {
        var CACHE = 'aquarelle-calme-8dc29a8d1d1e';
        var SONS = ["assets/assets/musique/dreamy-flashback.00ae096f8039038b2e6c18c54e1da63e.mp3","assets/assets/musique/gymnopedie-1.789e91a8223efb10b9055238ee70eef8.mp3","assets/assets/musique/meditation-1.2eae0bbf1a53a06d454696859900d1aa.mp3","assets/assets/musique/meditation-2.048c71e00a2d19e0c8d6243849d547df.mp3","assets/assets/nature/eau.af654ffadf96e2d4d8c81ab9388c88c7.mp3","assets/assets/nature/feu.509dbc863fc5d3ee76abbf07a0412672.mp3","assets/assets/nature/mer.0b958ed650424c51734ab17b1d6558e1.mp3","assets/assets/nature/nuit.b17422c10ca112ac019483dd82d1b466.mp3","assets/assets/nature/pluie.49b7fbc0befb71ac3bbf594682bd0aa2.mp3","assets/assets/nature/vent.a66cf21fb3772b7472f051b4dd0fb5a5.mp3"];
        var etat = { possible: 'serviceWorker' in navigator && 'caches' in window, fait: 0, total: SONS.length, pret: false };
        window.aquarelleHorsLigne = etat;
        function prevenir() {
          window.dispatchEvent(new Event('aquarelle-hors-ligne'));
        }
        if (!etat.possible) return;

        function enregistrerSons() {
          return caches.open(CACHE).then(function (cache) {
            // L'un après l'autre : on ne sature pas la connexion du téléphone.
            return SONS.reduce(function (suite, adresse) {
              return suite
                .then(function () {
                  return cache.match(adresse);
                })
                .then(function (dejaLa) {
                  if (dejaLa) return;
                  return fetch(adresse).then(function (reponse) {
                    if (reponse.ok) return cache.put(adresse, reponse);
                  });
                })
                .then(
                  function () {
                    etat.fait++;
                    prevenir();
                  },
                  function () {
                    // Pas de réseau pour ce fichier : on réessaiera à la prochaine ouverture.
                  }
                );
            }, Promise.resolve());
          });
        }

        navigator.serviceWorker
          .register('sw.js')
          .then(function () {
            return navigator.serviceWorker.ready;
          })
          .then(enregistrerSons)
          .then(function () {
            etat.pret = etat.fait === etat.total;
            prevenir();
          })
          .catch(function () {});
      })();
    </script>
  </body>
</html>
